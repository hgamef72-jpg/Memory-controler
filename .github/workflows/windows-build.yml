name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: memoryguard-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile desktop application
        run: gradle :app:compileKotlin
      - name: Build MSI package
        run: gradle :app:packageMsi
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MemoryGuard-Windows-MSI
          path: app/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
          retention-days: 14
